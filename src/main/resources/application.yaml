spring:
  application:
    name: System
  datasource:
    url: ${DATABASE_URL:jdbc:h2:mem:school_db}
    username: ${DATABASE_USERNAME:sa}
    password: ${DATABASE_PASSWORD:}
  h2:
    console:
      enabled: ${H2_CONSOLE_ENABLED:true}
      path: /h2-console
  jpa:
    hibernate:
      format_sql: false
      ddl-auto: validate
    show-sql: false

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET:}
  expiration: ${JWT_EXPIRATION:86400000}

lms:
  bootstrap-admin:
    email: ${LMS_ADMIN_EMAIL:}
    password: ${LMS_ADMIN_PASSWORD:}