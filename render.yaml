services:
  - type: web
    name: lms-backend
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /actuator/health
    envVars:
      - key: DB_URL
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: LMS_CORS_ALLOWED_ORIGINS
        sync: false
      - key: LMS_SAMPLE_DATA_ENABLED
        value: "false"
      - key: STORAGE_LOCATION
        value: /tmp/uploads
