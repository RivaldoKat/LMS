spring:
  application:
    name: System
  datasource:
    url: jdbc:h2:mem:school_db
    driver-class-name: org.h2.Driver
    username: sa
    password: password
  h2:
    console:
      enable: true
      path: /h2-console
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      format_sql: true
    show-sql: true

server:
  port: 8080

jwt:
  secret: "this_is_a_very_secure_and_long_secret_key_for_jwt_signing_2026!"
  expiration: 86400000 # 24 hours in milliseconds